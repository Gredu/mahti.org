baseURL = "https://mahti.org"
languageCode = "fi-fi"
title = "mahti.org"
enableGitInfo = true

[module]
  [[module.imports]]
    path = "github.com/hugomods/icons"
  [[module.imports]]
    path = "github.com/hugomods/icons/vendors/lucide"

[taxonomies]
  blogi = "blogit"
  tag = "tags"

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    style = "solarized-dark"
    tabWidth = 2

[security]
  [security.exec]
    allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^npx$', '^postcss$', '^git$']
